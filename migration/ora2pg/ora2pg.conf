# =============================================================================
# Ora2Pg 25.x - configuración de referencia para el laboratorio
#
# Esta configuración está pensada para ejecutarse DENTRO de la red de Docker
# Compose (hosts "oracle" y "edb"). Si ejecutas Ora2Pg desde el host, cambia
# los hosts por localhost.
#
# No es la ruta principal del laboratorio: el ETL propio ofrece control fino
# sobre tipos, LOBs y validación. Ora2Pg se usa para assessment, generación
# de DDL y migraciones masivas.
# =============================================================================

# --- Origen Oracle -----------------------------------------------------------
ORACLE_DSN  dbi:Oracle:host=oracle;service_name=FREEPDB1;port=1521
ORACLE_USER ventas
ORACLE_PWD  VentasLab_2026
SCHEMA      VENTAS

# --- Destino EPAS ------------------------------------------------------------
PG_DSN   dbi:Pg:dbname=ventas;host=edb;port=5444
PG_USER  ventas
PG_PWD   VentasLab_2026
PG_VERSION 16

# --- Objetos ----------------------------------------------------------------
EXPORT_SCHEMA   1
CREATE_SCHEMA   1
COMPILE_SCHEMA  0
DISABLE_TRIGGERS 1
FK_CONSTRAINTS  0
USE_TABLESPACE  0

# --- Salida -----------------------------------------------------------------
OUTPUT_DIR   /tmp/ora2pg
LOG_FILE     /tmp/ora2pg/ora2pg.log
FILE_PER_TABLE 0
JOBS        1

# --- Mapeo de tipos ---------------------------------------------------------
# Ora2Pg ya aplica conversiones razonables. Estas directivas permiten afinar:
DEFAULT_NUMERIC numeric
# DATA_TYPE NUMBER:numeric,VARCHAR2:varchar,CLOB:text,BLOB:bytea

# --- Exclusiones del laboratorio -------------------------------------------
# Las vistas materializadas y los triggers se revisan a mano porque EPAS no
# soporta REFRESH FAST ON COMMIT ni todos los tipos de trigger de Oracle.
EXCLUDE     TABLE:^NT_
# EXCLUDE   TABLE:.*_TMP
